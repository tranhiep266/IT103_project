<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabApp - Vocabulary</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/quizz.css" />
  </head>

  <body>
    <nav class="headLogin" id="headLogin">
      <p class="VocabAppMain" id="VocabAppMain">VocabApp</p>
      <div class="categoriesHead">
        <p onclick="goDash()">Dashboard</p>
        <p onclick="goCategory()">Categories</p>
        <p onclick="goWordPage()">Vocabulary</p>
        <p onclick="goFlashCard()">Flashcards</p>
        <p class="main-page">Quiz</p>
      </div>
      <div class="logoutContainer">
        <p id="user-name">Hi,</p>
        <button class="logoutBtn" id="logout" onclick="logoutAccount()">
          Logout
        </button>
      </div>
    </nav>

    <div>
      <div class="navTitle">
        <p class="titleText">Vocabulary Words</p>
        <button
          class="addBtn"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
          data-bs-whatever="add"
        >
          Add New Word
        </button>
      </div>

      <div class="filterContainer">
        <select id="categoryFilter" class="categoryDropdown">
          <option value="">All Categories</option>
        </select>
      </div>

      <table>
        <thead>
          <tr class="headTable">
            <td>DATE</td>
            <td>CATEGORY</td>
            <td>SCORE</td>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>
      <p>&copy; 2024 VocabApp. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/quizz.js"></script>
  </body>
</html>
