<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <nav class="headLogin" id="headLogin">
      <p class="VocabAppMain" id="VocabAppMain">VocabApp</p>
      <div class="categoriesHead">
        <p class="main-page">Dashboard</p>
        <p onclick="goCate()">Categories</p>
        <p onclick="goWordPage()">Vocabulary</p>
        <p onclick="goFlashCard()">Flashcards</p>
        <p onclick="goQuizz()">Quiz</p>
      </div>
      <div class="logoutContainer">
        <p id="user-name">Hi,</p>
        <button class="logoutBtn" id="logout" onclick="logoutAccount()">
          Logout
        </button>
      </div>
    </nav>

    <div class="bodyPage">
      <p class="title-name" id="title-name">Chào mừng bạn đã quay lại học,</p>
      <p class="content">
        Tiếp tục học từ vựng và cải thiện kỹ năng của bạn ngay hôm nay.
      </p>
      <div class="doubleBtn">
        <button class="createBtn" onclick="goQuizz()">Làm Quiz</button>
      </div>
    </div>

    <footer>
      <p>&copy; 2024 VocabApp. All rights reserved.</p>
    </footer>
  </body>
  <script src="../js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
