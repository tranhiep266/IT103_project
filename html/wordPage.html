<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabApp - Vocabulary</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/wordPage.css" />
  </head>

  <body>
    <nav class="headLogin" id="headLogin">
      <p class="VocabAppMain" id="VocabAppMain">VocabApp</p>
      <div class="categoriesHead">
        <p onclick="goDash()">Dashboard</p>
        <p onclick="goCategory()">Categories</p>
        <p class="main-page">Vocabulary</p>
        <p onclick="goFlashCard()">Flashcards</p>
        <p onclick="goQuizz()">Quiz</p>
      </div>
      <div class="logoutContainer">
        <p id="user-name">Hi,</p>
        <button class="logoutBtn" id="logout" onclick="logoutAccount()">
          Logout
        </button>
      </div>
    </nav>

    <div>
      <div class="navTitle">
        <p class="titleText">Vocabulary Words</p>
        <button
          class="addBtn"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
          data-bs-whatever="add"
        >
          Add New Word
        </button>
      </div>

      <div class="filterContainer">
        <select id="categoryFilter" class="categoryDropdown">
          <option value="">All Categories</option>
        </select>
      </div>

      <div class="searchContainer">
        <input
          type="text"
          placeholder="Search vocabulary..."
          class="searchTask"
        />
      </div>

      <table>
        <thead>
          <tr class="headTable">
            <td>WORD</td>
            <td>MEANING</td>
            <td>CATEGORY</td>
            <td>ACTIONS</td>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">
              Delete Word
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this word?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirm-delete">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add/Edit Word
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="edit-form">
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Word</label>
                <input
                  type="text"
                  class="form-control"
                  id="recipient-name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="message-text" class="col-form-label">Meaning</label>
                <textarea
                  class="form-control"
                  id="message-text"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="word-category" class="col-form-label"
                  >Category</label
                >
                <select class="form-control" id="word-category" required>
                  <option value="">Select a category</option>
                </select>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2024 VocabApp. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/wordPage.js"></script>
  </body>
</html>
