<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabApp - Vocabulary</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/flashCard.css" />
  </head>

  <body>
    <nav class="headLogin" id="headLogin">
      <p class="VocabAppMain" id="VocabAppMain">VocabApp</p>
      <div class="categoriesHead">
        <p onclick="goDash()">Dashboard</p>
        <p onclick="goCategory()">Categories</p>
        <p onclick="goWordPage()">Vocabulary</p>
        <p class="main-page">Flashcards</p>
        <p onclick="goQuizz()">Quiz</p>
      </div>
      <div class="logoutContainer">
        <p id="user-name">Hi,</p>
        <button class="logoutBtn" id="logout" onclick="logoutAccount()">
          Logout
        </button>
      </div>
    </nav>

    <div class="navTitle">
      <p class="titleText">Flashcard Learning</p>
    </div>
    <div class="filterContainer">
      <select id="categoryFilter" class="categoryDropdown">
        <option value="">All Categories</option>
      </select>
    </div>

    <div>
      <div class="flip-card-container">
        <div class="flip-card">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <h1>Dog</h1>
            </div>
            <div class="flip-card-back">
              <h1>con chó</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="btn">
        <button class="preBtn btn btn-primary">Previous</button>
        <button class="malBtn btn btn-primary">Mark As Learned</button>
        <button class="nextBtn btn btn-primary">Next</button>
      </div>

      <div>
        <div class="textProgress">
          <span>Progress</span>
          <span>1/1</span>
        </div>

        <div
          class="progress"
          role="progressbar"
          aria-label="Basic example"
          aria-valuenow="100"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar" style="width: 100%"></div>
        </div>
      </div>
    </div>

    <div class="navTitle">
        <p class="titleText">Vocabulary Words</p>
      </div>

      <table>
        <thead>
          <tr class="headTable">
            <td>WORD</td>
            <td>MEANING</td>
            <td>STATUS</td>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>
      <p>&copy; 2024 VocabApp. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/flashCard.js"></script>
  </body>
</html>
